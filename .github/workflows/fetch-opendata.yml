name: 抓取開放資料快照

# 為什麼要這一步：
# 瀏覽器有「跨來源限制（CORS）」—— 網頁裡的 JavaScript 不能直接讀 data.taipei 的回應。
# 但這個限制只存在於瀏覽器。GitHub Actions 是在伺服器上跑的，抓資料完全不受影響。
# 所以改成：伺服器定時抓 → 存成自己網站裡的檔案 → 網頁讀「自己家」的檔案（同源，一定通）。

on:
  schedule:
    # 資料每月更新，所以每月抓一次就夠（UTC 20:00 = 臺北隔天 04:00）
    - cron: "0 20 5 * *"
  workflow_dispatch: # 也可以在 Actions 頁面手動按一下就跑

permissions:
  contents: write # 需要寫入權限才能把抓回來的檔案 commit 回去

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 向 data.taipei 取資料
        run: |
          mkdir -p public/data
          curl -sSfL --retry 3 --retry-delay 5 --max-time 90 \
            "https://data.taipei/api/v1/dataset/7e5c4a52-b2ed-49c0-a103-caa72bda9d47?scope=resourceAquire&limit=1000" \
            -o public/data/cases.json

      - name: 檢查格式，並把真實欄位印出來
        run: |
          node -e "
            const d = require('./public/data/cases.json');
            if (!d.result || !Array.isArray(d.result.results)) {
              console.error('格式不符：找不到 result.results'); process.exit(1);
            }
            const rows = d.result.results;
            if (rows.length === 0) { console.error('回傳 0 筆'); process.exit(1); }
            console.log('總案件數 count =', d.result.count);
            console.log('這次抓回筆數 =', rows.length);
            console.log('--- 真實欄位名稱 ---');
            console.log(JSON.stringify(Object.keys(rows[0])));
            console.log('--- 第一筆 ---');
            console.log(JSON.stringify(rows[0], null, 1));
          "
          ls -la public/data/

      - name: 有變更才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cases.json
          if git diff --staged --quiet; then
            echo "資料沒有變化，不需要 commit"
          else
            git commit -m "自動更新：陳情資料快照"
            git push
          fi
